name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt ruff==0.8.4
      - name: Lint
        run: ruff check app ml tests
      - name: Unit tests (no database needed)
        env:
          DATABASE_URL: postgresql://dummy   # settings need a value; unit tests never connect
        run: pytest tests -q --ignore=tests/integration

  integration:
    # The integrity invariants the README claims — quarantine/roles/disputes, the stale-reference escape
    # hatch, the monotonic watermark, leader-lock exclusivity — proven against a real Postgres on every push.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: DB-backed invariant tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signal
          INTEGRATION: "1"
        run: pytest tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
